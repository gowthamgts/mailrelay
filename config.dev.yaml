log_level: debug

smtp:
  addr: "127.0.0.1:2525"
  # Set both PEM paths to advertise STARTTLS (TLS 1.2+); reloaded every handshake.
  # tls_cert: "/etc/letsencrypt/live/mx.example.com/fullchain.pem"
  # tls_key: "/etc/letsencrypt/live/mx.example.com/privkey.pem"
  require_tls: false # reject MAIL FROM before STARTTLS when true; requires both paths
  domain: "localhost"
  max_message_bytes: 26214400
  max_recipients: 100
  read_timeout: 60s
  write_timeout: 60s

auth:
  spf: "off"
  dkim: "off"
  dmarc: "off"

http:
  addr: "127.0.0.1:2623"
  protect_metrics: false
  auth:
    enabled: false # set to true only when at least one provider is configured below
    cookie_name: "mailrelay_session"
    cookie_samesite: "lax"
    session_ttl: 12h
    redirect_url: "" # default: http://localhost:2623/auth/callback when browsing on localhost
    allowed_email_domains: []
    # providers:
    #   - name: "google"
    #     issuer_url: "https://accounts.google.com"
    #     client_id: "your-client-id"
    #     client_secret: "your-client-secret"
    #     scopes: [] # optional extra scopes

retry:
  max_retries: 1
  initial_wait: 500ms
  max_wait: 2s
  timeout: 10s
  retry_on_timeout: true

# Per-rule signing_secret is stored in the rules database, configured in the UI.
# Empty = unsigned. Generate a secret in the rule editor; see docs/webhooks.md.
webhook:
  workers: 4 # maximum concurrent deliveries; pending retries survive restarts
  shutdown_timeout: 30s # allow in-flight requests to finish before leaving them pending
  allow_private_networks: true # dev webhooks usually point at localhost

webui:
  enabled: true
  db_path: "mailrelay-dev.db"
  retention_days: 7
  raw_email_dir: "tmp/emails"
