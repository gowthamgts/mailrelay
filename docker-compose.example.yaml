services:
  mailrelay:
    image: ghcr.io/gowthamgts/mailrelay:latest
    restart: unless-stopped

    ports:
      - "25:25"
      # The web UI has no authentication unless http.auth is configured, so only
      # publish it on localhost (reach it via SSH tunnel or a reverse proxy).
      - "127.0.0.1:2623:2623"

    # All persistent state (database, raw emails, optional config) lives in /data.
    # Image defaults: web UI enabled, db at /data/mailrelay.db, emails in /data/emails.
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - mailrelay_data:/data
      # Optional config file (see config.example.yaml). Needed for settings that
      # take lists, such as smtp.allowed_recipients and http.auth.providers.
      # - ./config.yaml:/data/config.yaml:ro

    # Override any scalar config value with MAILRELAY_ env vars.
    # Use __ (double underscore) for nested keys, e.g. SMTP__DOMAIN -> smtp.domain.
    environment:
      - MAILRELAY_SMTP__DOMAIN=mx.example.com
      # Needed if webhooks point at services on your LAN, in Docker or on localhost:
      # - MAILRELAY_WEBHOOK__ALLOW_PRIVATE_NETWORKS=true
      # - MAILRELAY_LOG_LEVEL=debug
      # - MAILRELAY_WEBUI__RETENTION_DAYS=30

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2623/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mailrelay_data:
    driver: local
