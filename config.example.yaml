# A production-leaning example: auth checks are enforced and recipients are
# restricted. The built-in defaults are more permissive (auth checks "log",
# any recipient accepted), which is handier for trying things out.
#
# Every scalar value can be overridden with a MAILRELAY_ environment variable.
# Use __ (double underscore) for nesting: MAILRELAY_SMTP__ADDR -> smtp.addr
# Lists (allowed_recipients, providers, allowed_email_domains) must be set here.

log_level: info # MAILRELAY_LOG_LEVEL

smtp:
  addr: "0.0.0.0:25" # MAILRELAY_SMTP__ADDR
  domain: "mailrelay.example.com" # MAILRELAY_SMTP__DOMAIN
  max_message_bytes: 26214400 # 25MB
  max_recipients: 5
  read_timeout: 60s
  write_timeout: 60s
  allowed_recipients: # only accept mail to these patterns
    - "*@alerts.example.com"
    - "support@example.com"

auth: # each check can be "off", "log", or "enforce"
  spf: enforce # MAILRELAY_AUTH__SPF    (reject on fail. use "log" for testing.)
  dkim: enforce # MAILRELAY_AUTH__DKIM
  dmarc: enforce # MAILRELAY_AUTH__DMARC

http:
  addr: "127.0.0.1:2623" # MAILRELAY_HTTP__ADDR (HTTP server for health checks, metrics, and web UI)
  protect_metrics: false # MAILRELAY_HTTP__PROTECT_METRICS (require login for /metrics when auth is enabled; /healthz is always public)
  auth:
    enabled: false # MAILRELAY_HTTP__AUTH__ENABLED (set to true only when at least one provider is configured below)
    cookie_name: "mailrelay_session" # MAILRELAY_HTTP__AUTH__COOKIE_NAME
    cookie_samesite: "lax" # MAILRELAY_HTTP__AUTH__COOKIE_SAMESITE (lax, strict, none)
    # cookie_secure: true # MAILRELAY_HTTP__AUTH__COOKIE_SECURE (default: false on localhost, true otherwise)
    # cookie_domain: "" # MAILRELAY_HTTP__AUTH__COOKIE_DOMAIN (optional; default: the host the UI is served on)
    session_ttl: 12h # MAILRELAY_HTTP__AUTH__SESSION_TTL
    session_secret: "" # MAILRELAY_HTTP__AUTH__SESSION_SECRET (optional, stable secret so sessions survive restarts and work across instances)
    redirect_url: "" # MAILRELAY_HTTP__AUTH__REDIRECT_URL (optional, eg. https://mail.example.com/auth/callback; default: derived from the request host)
    allowed_email_domains: [] # empty = any account at the provider; when set, the email must also be verified
    # Any OpenID Connect provider works (Google, Okta, Auth0, Keycloak, Authentik, ...).
    # Endpoints are discovered from issuer_url. GitHub is not supported (it is not OIDC).
    # Register <your-url>/auth/callback as the redirect URI with the provider.
    # providers:
    #   - name: "google"
    #     issuer_url: "https://accounts.google.com" # optional for name "google"
    #     client_id: "your-client-id"
    #     client_secret: "your-client-secret"
    #     scopes: [] # optional extra scopes ("openid email profile" are always requested)

retry:
  max_retries: 3 # MAILRELAY_RETRY__MAX_RETRIES
  initial_wait: 1s # MAILRELAY_RETRY__INITIAL_WAIT
  max_wait: 30s # MAILRELAY_RETRY__MAX_WAIT
  timeout: 30s # MAILRELAY_RETRY__TIMEOUT (per-request HTTP timeout; 0 = no timeout; can be overridden per-webhook)
  retry_on_timeout: true # MAILRELAY_RETRY__RETRY_ON_TIMEOUT (retry timed-out requests; can be overridden per-webhook)

webhook:
  workers: 4 # maximum concurrent deliveries; pending retries survive restarts
  shutdown_timeout: 30s # allow in-flight requests to finish before leaving them pending
  # Let webhooks (and the rule editor's Test button) reach loopback, private
  # (10/8, 172.16/12, 192.168/16, fc00::/7), link-local (incl. 169.254.169.254
  # cloud metadata) and CGNAT/Tailscale (100.64/10) addresses. Off by default so
  # a rule can't be used to probe your internal network. Turn it on if your
  # webhooks point at services on your LAN, in Docker or on localhost.
  allow_private_networks: false # MAILRELAY_WEBHOOK__ALLOW_PRIVATE_NETWORKS

webui:
  enabled: true # MAILRELAY_WEBUI__ENABLED (rules are stored in the web UI database; with false no rules load and all mail is dropped)
  db_path: "mailrelay.db" # MAILRELAY_WEBUI__DB_PATH (Docker default: /data/mailrelay.db)
  retention_days: 7 # MAILRELAY_WEBUI__RETENTION_DAYS (0 = keep forever)
  raw_email_dir: "" # MAILRELAY_WEBUI__RAW_EMAIL_DIR (Docker default: /data/emails)
